  <style>
    #hot-text {
      position: fixed;
      top: 10vh;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Barabara', sans-serif;
      font-size: 30px;
      line-height: 1.6;
      color: white;
      text-decoration: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 999;
    }
  </style>

  <body>

    <div class="center">
      <!--<h2> Sketch 1</h2> -->
      <script src="sketch.js"></script>
    </div>
    <a id="hot-text" href="../sketch2/index.html">ITS GETTING HOT! LETS HEAD TO THE FOREST IN THIS HASHTAG.<br>#EXPLOREMORE</a>

    <!--Debugged via Claude below for sketch1, (May, 2026) -->
    <script>
      window.addEventListener('mousemove', function(e) {
        var el = document.getElementById('hot-text');
        var pct = e.clientY / window.innerHeight;
        var a = Math.max(0, Math.min(1, (0.45 - pct) / (0.45 - 0.08)));
        el.style.opacity = a;
        el.style.pointerEvents = a > 0.05 ? 'auto' : 'none';
      });
    </script>
